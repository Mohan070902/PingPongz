name: Build & Release PingPongzzz

on:
  push:
    branches: [ main, mohan ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: PingPongzzz-Windows.exe
            binary_path: target/release/PingPongzzz.exe
          - os: ubuntu-latest
            artifact_name: PingPongzzz-Linux-x86_64
            binary_path: target/release/PingPongzzz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Build Release Binary
        run: cargo build --release

      - name: Prepare Linux Artifact
        if: runner.os == 'Linux'
        run: |
          cp ${{ matrix.binary_path }} ./${{ matrix.artifact_name }}
          chmod +x ./${{ matrix.artifact_name }}

      - name: Prepare Windows Artifact
        if: runner.os == 'Windows'
        run: |
          Copy-Item "${{ matrix.binary_path }}" -Destination "./${{ matrix.artifact_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Display downloaded files
        run: ls -laR release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/PingPongzzz-Windows.exe/PingPongzzz-Windows.exe
            release-artifacts/PingPongzzz-Linux-x86_64/PingPongzzz-Linux-x86_64
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: Rubix – PingPongzzz ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          body: |
            ## Rubix – PingPongzzz v1.0.0
            Secure Offline-First Peer-to-Peer LAN Messaging Application

            ### Download & Run:
            - **Windows**: Download `PingPongzzz-Windows.exe` and run.
            - **Linux**: Download `PingPongzzz-Linux-x86_64`, make executable (`chmod +x PingPongzzz-Linux-x86_64`), and run.

            ### Features:
            - Fully offline & peer-to-peer (no cloud, no accounts, no server)
            - End-to-end encrypted with Noise_XX & ChaCha20-Poly1305
            - Automatic LAN peer discovery (mDNS + UDP broadcast)
            - Local SQLite WAL storage with self-healing integrity checks
